name: Security

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  issues: write

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit high severity dependencies
        run: npm audit --audit-level=high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  scheduled-alert:
    if: ${{ always() && github.event_name == 'schedule' && needs.npm-audit.result != 'success' }}
    needs: [npm-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Create security alert issue
        uses: actions/github-script@v9
        with:
          script: |
            const title = `[SECURITY] Scheduled audit failed (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              "자동 보안 점검(`npm audit --audit-level=high`)이 실패했습니다.",
              "",
              "## 확인 항목",
              "- Actions > Security 워크플로우 로그 확인",
              "- 취약 패키지와 영향 범위 확인",
              "- `npm audit fix` 적용 가능 여부 확인",
              "- 필요 시 즉시 롤백 또는 hotfix 배포",
              "",
              "## 대응 참고",
              "- `docs/security-incident-response.md`"
            ].join("\n");
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["security", "incident", "automated"],
              });
            } catch (error) {
              // 레이블이 없어도 알림 이슈는 생성한다.
              if (error?.status === 422) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
                return;
              }
              throw error;
            }
